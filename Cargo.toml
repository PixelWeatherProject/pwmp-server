[package]
name = "pwmp-server"
version = "4.0.0"
edition = "2024"
authors = ["Fábián Varga <23280129+br0kenpixel@users.noreply.github.com>"]
description = "The PixelWeather Messaging Protocol server."
rust-version = "1.99"
homepage = "https://github.com/PixelWeatherProject"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/PixelWeatherProject/pwmp-server"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
# Strip debug info from dependencies
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[dependencies]
pwmp-client = { git = "https://github.com/PixelWeatherProject/pwmp-client.git", branch = "v4" }
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
    "rustls-no-provider",
] }
rustls = { version = "0.23.46", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
tokio = { version = "1.54.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "socket2",
    "signal",
] }
confy = { version = "2.0.0", default-features = false, features = [
    "yaml_conf",
] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "sqlite",
    "tls-rustls",
] }
tracing = { version = "0.1.44", features = ["max_level_debug"] }
homedir = { version = "0.3.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
moka = { version = "0.12.16", features = ["future"] }
clap = { version = "4.6.7", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
tracing-subscriber = "0.3.23"
serde_json = "1.0.154"
async-trait = "0.1.92"
serde_with = "3.24.0"
thiserror = "2.0.21"
chrono = "0.4.45"
regex = "1.13.1"
url = "2.5.8"
