[package]
name = "pwmp-server"
version = "4.0.0"
edition = "2024"
authors = ["Fábián Varga <23280129+br0kenpixel@users.noreply.github.com>"]
description = "The PixelWeather Messaging Protocol server."
rust-version = "1.99"
homepage = "https://github.com/PixelWeatherProject"
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/PixelWeatherProject/pwmp-server"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[dependencies]
pwmp-client = { git = "https://github.com/PixelWeatherProject/pwmp-client.git", tag = "v3.1.1" }
time = { version = "0.3.55", default-features = false, features = ["macros"] }
sqlx = { version = "0.9.0", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "sqlite",
    "tls-rustls",
] }
tokio = { version = "1.54.0", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "socket2",
    "signal",
] }
confy = { version = "2.0.0", default-features = false, features = [
    "yaml_conf",
] }
homedir = { version = "0.3.6", default-features = false }
whoami = { version = "2.1.3", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
moka = { version = "0.12.16", features = ["future"] }
reqwest = { version = "0.13.5", features = ["json"] }
clap = { version = "4.6.7", features = ["derive"] }
socket2 = { version = "0.6.5", features = ["all"] }
tracing-subscriber = "0.3.23"
circular-queue = "0.2.7"
serde_json = "1.0.154"
async-trait = "0.1.92"
serde_with = "3.24.0"
thiserror = "2.0.21"
minicache = "0.1.1"
semaphore = "0.4.0"
tracing = { version = "0.1.44", features = ["max_level_debug"] }
chrono = "0.4.45"
regex = "1.13.1"
url = "2.5.8"
